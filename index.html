<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Chat — powered by Pollinations</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #252525;
      --accent: #7c6af7;
      --text: #e8e8e8;
      --muted: #555;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .model-select { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.ai.thinking { color: var(--muted); font-style: italic; }
    footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    #input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; resize: none; outline: none; font-family: inherit; }
    #input:focus { border-color: var(--accent); }
    #send { background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: opacity 0.15s; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }
    #send:hover:not(:disabled) { opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Jarvis Chat</h1>
    <select class="model-select" id="model">
      <option value="openai-fast">GPT-OSS Fast (free)</option>
    </select>
  </header>
  <div id="chat">
    <div class="msg ai">Hey, I'm Jarvis. What do you need?</div>
  </div>
  <footer>
    <textarea id="input" rows="1" placeholder="Ask anything..." maxlength="4000"></textarea>
    <button id="send">Send</button>
  </footer>

  <script>
    const REFERRER = 'pollinations-chat-kohl.vercel.app';
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const modelSel = document.getElementById('model');
    const history = [{ role: 'system', content: 'You are Jarvis, a sharp and helpful AI assistant. Be concise.' }];

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function ask(text) {
      history.push({ role: 'user', content: text });
      const thinking = addMsg('ai', '...');
      thinking.classList.add('thinking');
      send.disabled = true;

      try {
        const res = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelSel.value,
            messages: history,
            stream: false,
            referrer: REFERRER,
          }),
        });
        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content ?? 'No response.';
        history.push({ role: 'assistant', content: reply });
        thinking.textContent = reply;
        thinking.classList.remove('thinking');
      } catch (e) {
        thinking.textContent = 'Error: ' + e.message;
      }
      send.disabled = false;
      input.focus();
    }

    send.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      addMsg('user', text);
      input.value = '';
      ask(text);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
